name: iOS release validation

on:
  pull_request:
    paths:
      - 'apps/ios/**'
      - 'apps/packages/ApertureKit/**'
      - 'contracts/**'
      - 'tools/check-swift-static.py'
      - 'tools/coverage-summary.py'
      - 'tools/validate-ios-release.sh'
      - 'tools/validate-ios-store-assets.sh'
      - 'tools/capture-ios-store-screenshots.sh'
      - '.github/workflows/ios-release-validation.yml'
      - '.github/workflows/ios-alpha-internal-testflight.yml'
  push:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - 'apps/packages/ApertureKit/**'
      - 'contracts/**'
      - 'tools/check-swift-static.py'
      - 'tools/coverage-summary.py'
      - 'tools/validate-ios-release.sh'
      - 'tools/validate-ios-store-assets.sh'
      - 'tools/capture-ios-store-screenshots.sh'
      - '.github/workflows/ios-release-validation.yml'
      - '.github/workflows/ios-alpha-internal-testflight.yml'
  schedule:
    # Full UI regression is intentionally off the PR critical path.
    - cron: '23 08 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      ui-required: ${{ steps.classify.outputs.ui-required }}
      localization-changed: ${{ steps.classify.outputs.localization-changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - name: Classify UI-test scope
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          required=false
          localization_changed=false
          case "$GITHUB_EVENT_NAME" in
            schedule|workflow_dispatch)
              required=true
              ;;
            pull_request)
              changed_files="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
              if printf '%s\n' "$changed_files" | grep -Ev '\.md$|/Assets\.xcassets/' | grep -Eq \
                '^apps/ios/(ApertureApp/|ApertureAppUITests/|ApertureApp\.xcodeproj/)|^apps/packages/ApertureKit/Sources/ApertureUI/|^\.github/workflows/ios-release-validation\.yml$'; then
                required=true
              fi
              if printf '%s\n' "$changed_files" | grep -Eq \
                '/(en|es)\.lproj/|^apps/packages/ApertureKit/Sources/ApertureUI/Resources/'; then
                localization_changed=true
              fi
              ;;
          esac
          echo "ui-required=$required" >> "$GITHUB_OUTPUT"
          echo "localization-changed=$localization_changed" >> "$GITHUB_OUTPUT"

  validate:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Static policy and localization checks
        run: python3 tools/check-swift-static.py apps

      - name: App Store metadata and capture-script checks
        run: |
          bash -n tools/validate-ios-store-assets.sh tools/capture-ios-store-screenshots.sh
          tools/validate-ios-store-assets.sh

      - name: Shared package tests
        run: swift test --package-path apps/packages/ApertureKit --enable-code-coverage

      # T-70: coverage is reported, not gated. The table lands in the job's
      # step summary so untested source is found mechanically instead of by
      # the hand-triage pass T-65 needed.
      - name: Package coverage summary (advisory)
        run: |
          set -euo pipefail
          codecov_path="$(swift test --package-path apps/packages/ApertureKit --show-codecov-path)"
          python3 tools/coverage-summary.py "$codecov_path" >> "$GITHUB_STEP_SUMMARY"

      - name: Build unsigned release archive
        env:
          APERTURE_BUILD_NUMBER_OVERRIDE: ${{ github.run_number }}
        run: tools/validate-ios-release.sh "$RUNNER_TEMP/Aperture-Unsigned.xcarchive"

  ui-tests:
    needs: scope
    if: needs.scope.outputs.ui-required == 'true'
    runs-on: macos-26
    # The full 32-journey suite takes ~24 minutes on a healthy runner; on a slow
    # one, 30 minutes cancelled a run that had already finished testing while
    # xcodebuild was still writing the result bundle. 40 keeps the bound (a hang
    # still fails) without clipping legitimate schedule runs.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select and start an available iPhone simulator
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if ".iOS-" not in runtime:
                  continue
              for device in devices[runtime]:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator was found")
          ')"
          echo "IOS_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_id" || true

      # Building while the freshly-created simulator completes first-boot data
      # migration saves roughly two minutes on GitHub-hosted macOS runners.
      - name: Build application UI tests
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project apps/ios/ApertureApp.xcodeproj \
            -scheme ApertureApp \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/UITestDerivedData" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Run application UI tests
        env:
          LOCALIZATION_CHANGED: ${{ needs.scope.outputs.localization-changed }}
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$IOS_SIMULATOR_ID" -b

          # Pull requests exercise a minimal gate so iteration stays fast (owner
          # decision, 2026-08-28 — see TODO T-74): one compliance journey plus one
          # shell smoke. The complete suite runs on the weekday schedule and for
          # manual validation via workflow_dispatch.
          test_selection=(-only-testing:ApertureAppUITests)
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            test_selection=(
              # The fail-closed generation gate is enforced client-side, so no package
              # test can cover it. It runs per pull request rather than on the weekday
              # schedule: a compliance gate covered only by regression can sit broken
              # for a working day.
              -only-testing:ApertureAppUITests/ApertureAppUITests/testConfirmingWithoutAdjudicatingLeavesTheDisagreementStanding
              -only-testing:ApertureAppUITests/ApertureAppUITests/testAuthenticatedTabsExposeCoreMobileWorkflows
            )
            if [[ "$LOCALIZATION_CHANGED" == "true" ]]; then
              test_selection+=(
                -only-testing:ApertureAppUITests/ApertureAppUITests/testSpanishCoreNavigationUsesLocalizedAppAndPackageStrings
              )
            fi
          fi

          xcodebuild test-without-building \
            -project apps/ios/ApertureApp.xcodeproj \
            -scheme ApertureApp \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/UITestDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/UITests.xcresult" \
            -parallel-testing-enabled NO \
            "${test_selection[@]}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Preserve UI diagnostics on failure
        # cancelled() covers a job-timeout kill, which is exactly when the
        # partial .xcresult is the only evidence of what was running (T-35 class).
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-ui-test-diagnostics-${{ github.run_attempt }}
          path: ${{ runner.temp }}/UITests.xcresult
          if-no-files-found: ignore
          retention-days: 7
