name: Swift static checks

# Fast Linux text-policy gate. The macOS/Xcode archive build runs separately in
# ios-release-validation.yml; both checks are required and cover different failures.
on:
  push:
    branches: [main]
    paths: ['apps/**', 'tools/**', 'tests/tools/**', 'docs/**', 'README.md', '.github/workflows/swift-static.yml']
  pull_request:
    paths: ['apps/**', 'tools/**', 'tests/tools/**', 'docs/**', 'README.md', '.github/workflows/swift-static.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Static checks (balance, banned APIs, third-party SDKs, localisation parity)
        run: python3 tools/check-swift-static.py apps
      # T-69: the gates themselves are under test. Known-bad fixtures must fail
      # and the wiki builder's fatal paths must fire — a pattern edit that stops
      # detecting its fixture fails here instead of failing open (T-26, T-40).
      # docs/** is in this workflow's paths because the build-wiki self-test
      # catches an ADR missing from PAGE_MAP before publish does (T-39 class).
      - name: Tool self-tests (policy gate, wiki builder, coverage summary)
        run: python3 -m unittest discover -s tests/tools -p 'test_*.py' -v
