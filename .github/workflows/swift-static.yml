name: Swift static checks

# This is NOT a build. The scaffold targets iOS and can only be compiled on macOS with
# Xcode; a green run here means the text-level rules hold, not that the code compiles.
# Replace this with `xcodebuild build` on a macos runner once the project file exists.
on:
  push:
    branches: [main]
    paths: ['apps/**', 'tools/check-swift-static.py', '.github/workflows/swift-static.yml']
  pull_request:
    paths: ['apps/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static checks (balance, banned APIs, third-party SDKs, localisation parity)
        run: python3 tools/check-swift-static.py apps
