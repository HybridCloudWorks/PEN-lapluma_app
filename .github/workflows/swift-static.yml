name: Swift static checks

# Fast Linux text-policy gate. The macOS/Xcode archive build runs separately in
# ios-release-validation.yml; both checks are required and cover different failures.
on:
  push:
    branches: [main]
    paths: ['apps/**', 'tools/check-swift-static.py', '.github/workflows/swift-static.yml']
  pull_request:
    paths: ['apps/**', 'tools/check-swift-static.py', '.github/workflows/swift-static.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Static checks (balance, banned APIs, third-party SDKs, localisation parity)
        run: python3 tools/check-swift-static.py apps
