name: Publish wiki

# The wiki is a generated mirror of docs/ on main. Never edit the wiki directly —
# edits there are overwritten by the next run of this workflow.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'tools/build-wiki.py'
      - '.github/workflows/publish-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # The wiki mirrors docs/ on main and every generated page says so; a manual
      # dispatch from any other branch would silently replace the whole wiki with
      # that branch's docs.
      - name: Enforce publishing from main
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "The wiki mirrors docs/ on main; refusing to publish from $GITHUB_REF." >&2
            exit 1
          }

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # Auth travels as a per-invocation header so the token is never written to
      # the clone's .git/config for later steps to read.
      - name: Check out wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="$auth_header" clone \
            "https://github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-checkout

      # Runner-provided env vars only — nothing user-controlled is interpolated
      # into the script text.
      - name: Build wiki pages from docs/
        run: python3 tools/build-wiki.py . wiki-checkout "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"

      - name: Validate the generated link graph
        run: python3 tools/check-wiki-links.py wiki-checkout

      - name: Commit and push
        working-directory: wiki-checkout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi
          git commit -m "Publish docs/ from ${GITHUB_SHA::7}"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="$auth_header" push origin HEAD
