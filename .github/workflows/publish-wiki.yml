name: Publish wiki

# The wiki is a generated mirror of docs/ on main. Never edit the wiki directly —
# edits there are overwritten by the next run of this workflow.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'tools/build-wiki.py'
      - '.github/workflows/publish-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check out wiki
        run: |
          git clone \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" \
            wiki-checkout

      - name: Build wiki pages from docs/
        run: python3 tools/build-wiki.py . wiki-checkout "${{ github.server_url }}/${{ github.repository }}" "${{ github.ref_name }}"

      - name: Validate the generated link graph
        run: python3 tools/check-wiki-links.py wiki-checkout

      - name: Commit and push
        working-directory: wiki-checkout
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi
          git commit -m "Publish docs/ from ${GITHUB_SHA::7}"
          git push origin HEAD
